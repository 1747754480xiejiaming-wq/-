<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <rect width="1440" height="960" fill="#F7F2E8"/>
  <text x="72" y="88" font-family="Arial" font-size="18" font-weight="700" fill="#A8482A">CHA XU / UX FLOW</text>
  <text x="72" y="146" font-family="Arial" font-size="42" font-weight="700" fill="#173B2D">前端关键使用流程</text>
  <g font-family="Arial">
    <g transform="translate(72 250)"><rect width="250" height="150" rx="24" fill="#FFFDF8" stroke="#D9D0C1"/><text x="24" y="44" font-size="15" fill="#A8482A">01 / DISCOVER</text><text x="24" y="82" font-size="24" font-weight="700" fill="#173B2D">首页与检索</text><text x="24" y="116" font-size="15" fill="#617267">茶名、SKU、茶类入口</text></g>
    <text x="342" y="333" font-size="32" fill="#A8482A">→</text>
    <g transform="translate(390 250)"><rect width="250" height="150" rx="24" fill="#FFFDF8" stroke="#D9D0C1"/><text x="24" y="44" font-size="15" fill="#A8482A">02 / UNDERSTAND</text><text x="24" y="82" font-size="24" font-weight="700" fill="#173B2D">茶品与来源</text><text x="24" y="116" font-size="15" fill="#617267">批次、功效边界、依据</text></g>
    <text x="660" y="333" font-size="32" fill="#A8482A">→</text>
    <g transform="translate(708 250)"><rect width="250" height="150" rx="24" fill="#FFFDF8" stroke="#D9D0C1"/><text x="24" y="44" font-size="15" fill="#A8482A">03 / BREW</text><text x="24" y="82" font-size="24" font-weight="700" fill="#173B2D">分步冲泡</text><text x="24" y="116" font-size="15" fill="#617267">参数、步骤、完成反馈</text></g>
    <text x="978" y="333" font-size="32" fill="#A8482A">→</text>
    <g transform="translate(1026 250)"><rect width="250" height="150" rx="24" fill="#173B2D"/><text x="24" y="44" font-size="15" fill="#E9B59D">04 / CONSULT</text><text x="24" y="82" font-size="24" font-weight="700" fill="#FFFDF8">货源与咨询</text><text x="24" y="116" font-size="15" fill="#D8E3DC">主动同意、脱敏回执</text></g>
    <g transform="translate(72 500)"><rect width="1204" height="268" rx="28" fill="#FFFDF8" stroke="#D9D0C1"/><text x="32" y="48" font-size="22" font-weight="700" fill="#173B2D">后台闭环</text>
      <rect x="32" y="82" width="190" height="92" rx="16" fill="#EEF3EE"/><text x="56" y="120" font-size="18" font-weight="700" fill="#173B2D">资料导入</text><text x="56" y="150" font-size="14" fill="#617267">校验错误与修复</text>
      <text x="242" y="136" font-size="28" fill="#A8482A">→</text><rect x="286" y="82" width="190" height="92" rx="16" fill="#EEF3EE"/><text x="310" y="120" font-size="18" font-weight="700" fill="#173B2D">内容编辑</text><text x="310" y="150" font-size="14" fill="#617267">草稿与版本</text>
      <text x="496" y="136" font-size="28" fill="#A8482A">→</text><rect x="540" y="82" width="190" height="92" rx="16" fill="#EEF3EE"/><text x="564" y="120" font-size="18" font-weight="700" fill="#173B2D">审核发布</text><text x="564" y="150" font-size="14" fill="#617267">独立角色复核</text>
      <text x="750" y="136" font-size="28" fill="#A8482A">→</text><rect x="794" y="82" width="190" height="92" rx="16" fill="#EEF3EE"/><text x="818" y="120" font-size="18" font-weight="700" fill="#173B2D">公开展示</text><text x="818" y="150" font-size="14" fill="#617267">来源撤回联动</text>
      <text x="1004" y="136" font-size="28" fill="#A8482A">→</text><rect x="1048" y="82" width="124" height="92" rx="16" fill="#F8EBDD"/><text x="1072" y="120" font-size="18" font-weight="700" fill="#8B351F">审计</text><text x="1072" y="150" font-size="14" fill="#6B4D43">可追溯</text>
      <text x="32" y="224" font-size="15" fill="#617267">约束：同一角色不得同时完成编辑与最终发布；所有变化保留操作记录。</text>
    </g>
  </g>
</svg>
